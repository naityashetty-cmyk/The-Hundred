<!DOCTYPE html>
<html>
<head>
<title>Mini Hundred League Pro</title>
<style>
    body {
        margin:0; font-family:'Segoe UI', Tahoma, sans-serif; color:white; text-align:center;
        background: #0f0c29; overflow-x:hidden;
    }
    .overlay { min-height:100vh; padding:20px; background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e); }
    
    .team-icon {
        width: 60px; height: 60px; border-radius: 50%; display: inline-flex;
        align-items: center; justify-content: center; font-size: 20px; font-weight: bold;
        margin: 5px; cursor: pointer; border: 3px solid rgba(255,255,255,0.2); transition: 0.3s;
    }
    
    .mi-color { background: #004ba0; color: white; }
    .msg-color { background: #1b1b1b; color: #c5a059; }
    .sl-color { background: #ff822a; color: white; }
    .sb-color { background: #ef4123; color: white; }

    button { padding:12px 20px; margin:5px; font-weight:bold; border:none; border-radius:5px; cursor:pointer; background: #27ae60; color: white; }
    button:hover { background: #2ecc71; }
    
    #gameArea, #tossArea, #leagueEnd, #teamSelect, #victoryScreen { display:none; }
    
    .stats-grid { display: flex; justify-content: center; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
    .stat-card { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; width: 240px; border: 1px solid rgba(255,255,255,0.1); }
    
    .hud-container { display: flex; justify-content: center; gap: 20px; margin: 20px 0; align-items: center; flex-wrap: wrap;}
    .player-hud { background: rgba(0,0,0,0.5); padding: 15px; border-radius: 10px; border-left: 4px solid #f1c40f; min-width: 200px; }
    .prob-hud { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; min-width: 150px; }
    
    #commentaryBox { 
        background: rgba(0,0,0,0.7); width: 80%; max-width: 600px; margin: 20px auto; 
        padding: 15px; border-radius: 8px; border: 1px solid #444; height: 60px; 
        display: flex; align-items: center; justify-content: center; font-style: italic; color: #f1c40f;
    }

    #probBar { width: 100%; height: 10px; background: #444; border-radius: 5px; margin-top: 10px; overflow: hidden; }
    #probFill { height: 100%; width: 50%; background: #27ae60; transition: 0.5s; }

    .trophy-glow { font-size: 80px; text-shadow: 0 0 20px #f1c40f; animation: bounce 2s infinite; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    td { padding: 6px; border-bottom: 1px solid #333; }
</style>
</head>
<body>
<div class="overlay">

    <h1>🏏 MINI HUNDRED LEAGUE PRO</h1>

    <div id="loginArea">
        <h2>Manager Login</h2>
        <input id="username" placeholder="Enter Name" style="padding: 12px; width: 180px;">
        <button onclick="login()">Enter Stadium</button>
    </div>

    <div id="teamSelect">
        <h2>Choose Your Team</h2>
        <div id="logoPicker"></div>
    </div>

    <div id="tossArea">
        <h2 id="matchTitle"></h2>
        <div id="matchLogos"></div>
        <button onclick="doToss('bat')">Bat First</button>
        <button onclick="doToss('bowl')">Bowl First</button>
    </div>

    <div id="gameArea">
        <div class="hud-container">
            <div class="player-hud">
                <h3 id="strikerName" style="margin:0; color:#f1c40f;">Striker</h3>
                <span id="strikerStats">0 (0) | SR: 0.00</span>
            </div>
            <div class="prob-hud">
                <span style="font-size: 12px; color: #aaa;">WIN PROBABILITY</span>
                <div id="winProbText" style="font-weight: bold; font-size: 18px; display: block;">50%</div>
                <div id="probBar"><div id="probFill"></div></div>
            </div>
        </div>

        <div id="liveLogoContainer"></div>
        <h1 id="scoreInfo" style="font-size: 60px; margin: 5px 0;">0/0</h1>
        <h3 id="ballInfo" style="color:#aaa;">Balls: 0/100</h3>
        
        <div id="commentaryBox">Welcome to the pitch!</div>

        <div id="buttons"></div>
        <div id="result"></div>
        <button id="nextBtn" style="display:none; background:#e67e22;" onclick="nextMatch()">Next Match</button>
    </div>

    <div id="leagueEnd">
        <h1 style="color: #f1c40f;">🏆 GRAND FINAL 🏆</h1>
        <h2 id="finalistAnnouncement"></h2>
        <button onclick="playFinal()">START THE FINAL</button>
    </div>

    <div id="victoryScreen">
        <div class="trophy-glow">🏆</div>
        <h1 id="championName">TEAM NAME</h1>
        <h2>ARE THE HUNDRED CHAMPIONS!</h2>
        <button onclick="resetData()">Start New Season</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><h3>Standings</h3><div id="pointsTable"></div></div>
        <div class="stat-card"><h3>Orange Cap 🧢</h3><div id="orangeCap"></div></div>
        <div class="stat-card"><h3>Purple Cap 🟣</h3><div id="purpleCap"></div></div>
    </div>

    <button onclick="resetData()" style="margin-top:30px; opacity:0.3; font-size:10px;">Reset Tournament</button>
</div>

<script>
const teamData = {
    "MI London": { class: "mi-color", short: "MIL", players: ["Rohit Sharma", "Ishan Kishan", "Suryakumar Yadav", "Tilak Varma", "Hardik Pandya", "Tim David", "Romario Shepherd", "Gerald Coetzee", "Jasprit Bumrah", "Akash Madhwal", "Piyush Chawla"] },
    "Manchester Super Giants": { class: "msg-color", short: "MSG", players: ["KL Rahul", "Quinton de Kock", "Devdutt Padikkal", "Nicholas Pooran", "Marcus Stoinis", "Ayush Badoni", "Krunal Pandya", "Ravi Bishnoi", "Mohsin Khan", "Mayank Yadav", "Yash Thakur"] },
    "Sunrisers Leeds": { class: "sl-color", short: "SRL", players: ["Travis Head", "Abhishek Sharma", "Aiden Markram", "Heinrich Klaasen", "Nitish Reddy", "Abdul Samad", "Shahbaz Ahmed", "Pat Cummins", "Bhuvneshwar Kumar", "Mayank Markande", "T. Natarajan"] },
    "Southern Brave": { class: "sb-color", short: "SBR", players: ["David Warner", "Prithvi Shaw", "Mitchell Marsh", "Rishabh Pant", "Tristan Stubbs", "Axar Patel", "Abhishek Porel", "Kuldeep Yadav", "Anrich Nortje", "Khaleel Ahmed", "Mukesh Kumar"] }
};

const comms = {
    1: ["Just a single, rotating the strike.", "Pushed into the gap for one.", "Working the ball around for a single."],
    2: ["Two runs! Good hustle between the wickets.", "They push for two and get there safely.", "Brilliant running, they scamper for two."],
    3: ["Excellent running! They turn two into three.", "A long chase for the fielder, they get three."],
    4: ["FOUR! Pierced the gap beautifully.", "CRACKING SHOT! That's a boundary!", "One bounce and over the rope!"],
    5: ["Chaos in the field! Five runs taken.", "Overthrows! A nightmare for the bowler."],
    6: ["SIX! That is massive!", "INTO THE STANDS! Pure timing.", "Out of the park! High and handsome!"],
    "out": ["OUT! A massive wicket falls!", "CLEAN BOWLED! What a delivery.", "CAUGHT! The fielder makes no mistake."]
};

const teams = Object.keys(teamData);
let userTeam, opponent, batting, bowling;
let points = {}, allPlayers = []; 
let score = 0, wickets = 0, balls = 0, target = Infinity, innings = 1, strikerIdx = 0, fixtures = [], isFinal = false, maxBalls = 100;

function save() { localStorage.setItem("MHL_vFinal_PRO_SHARE", JSON.stringify({ points, allPlayers, fixtures, userTeam, isFinal })); }

function login() {
    const saved = localStorage.getItem("MHL_vFinal_PRO_SHARE");
    if (saved) {
        const d = JSON.parse(saved);
        points = d.points; allPlayers = d.allPlayers; fixtures = d.fixtures; userTeam = d.userTeam; isFinal = d.isFinal;
        document.getElementById("loginArea").style.display = "none";
        if (!userTeam) { document.getElementById("teamSelect").style.display = "block"; renderSelector(); }
        else { updateStandings(); startNextMatch(); }
    } else {
        teams.forEach(t => { points[t] = 0; teamData[t].players.forEach(p => allPlayers.push({ name: p, team: t, runs: 0, wickets: 0, bFaced: 0 })); });
        document.getElementById("loginArea").style.display = "none";
        document.getElementById("teamSelect").style.display = "block";
        renderSelector();
    }
}

function renderSelector() {
    let h = ""; teams.forEach(t => h += `<div class="team-icon ${teamData[t].class}" onclick="selectTeam('${t}')">${teamData[t].short}</div>`);
    document.getElementById("logoPicker").innerHTML = h;
}

function selectTeam(t) { 
    userTeam = t; document.getElementById("teamSelect").style.display = "none"; 
    for (let i = 0; i < teams.length; i++) for (let j = i + 1; j < teams.length; j++) fixtures.push([teams[i], teams[j]]);
    save(); startNextMatch(); 
}

function startNextMatch() {
    if (fixtures.length === 0) { showFinals(); return; }
    let m = fixtures.shift();
    if (m.includes(userTeam)) {
        opponent = (m[0] === userTeam) ? m[1] : m[0];
        document.getElementById("tossArea").style.display = "block";
        document.getElementById("matchTitle").innerHTML = userTeam + " vs " + opponent;
        document.getElementById("matchLogos").innerHTML = `<div class="team-icon ${teamData[userTeam].class}">${teamData[userTeam].short}</div> vs <div class="team-icon ${teamData[opponent].class}">${teamData[opponent].short}</div>`;
    } else { simulateBot(m[0], m[1]); save(); startNextMatch(); }
}

function doToss(c) {
    document.getElementById("tossArea").style.display = "none"; document.getElementById("gameArea").style.display = "block";
    document.getElementById("nextBtn").style.display = "none"; document.getElementById("result").innerHTML = "";
    innings = 1; target = Infinity; maxBalls = 100;
    if (c === "bat") { batting = userTeam; bowling = opponent; } else { batting = opponent; bowling = userTeam; }
    startInnings();
}

function startInnings() { score = 0; wickets = 0; balls = 0; strikerIdx = 0; updateUI("New innings begins..."); 
    let bh = ""; for (let i = 1; i <= 6; i++) bh += `<button onclick="playBall(${i})">${i}</button>`;
    document.getElementById("buttons").innerHTML = bh; }

function playBall(userInput) {
    let botChoice = Math.floor(Math.random() * 6) + 1;
    let s = allPlayers.find(p => p.name === teamData[batting].players[strikerIdx]);
    let b = allPlayers.find(p => p.name === teamData[bowling].players[6 + (balls % 5)]);
    let msg = "";
    let runsThisBall = 0;
    let isWicket = false;

    if (batting === userTeam) {
        runsThisBall = userInput;
        if (userInput === botChoice) isWicket = true;
    } else {
        runsThisBall = botChoice; 
        if (userInput === botChoice) isWicket = true;
    }

    if (isWicket) { 
        wickets++; if (b) b.wickets++; strikerIdx++; 
        msg = comms["out"][Math.floor(Math.random() * comms["out"].length)];
    } else { 
        score += runsThisBall; if (s) { s.runs += runsThisBall; s.bFaced++; }
        msg = comms[runsThisBall] ? comms[runsThisBall][Math.floor(Math.random() * comms[runsThisBall].length)] : "A quick run!";
    }
    balls++; updateUI(msg);

    if ((innings === 2 && score >= target) || balls >= maxBalls || wickets >= 10 || strikerIdx >= 11) {
        if (innings === 1) { target = score + 1; innings = 2; [batting, bowling] = [bowling, batting]; alert("Innings Over. Target: " + target); startInnings(); }
        else finishMatch();
    }
}

function updateUI(msg) {
    let sn = teamData[batting].players[strikerIdx] || "All Out";
    let sp = allPlayers.find(p => p.name === sn);
    let sr = (sp && sp.bFaced > 0) ? ((sp.runs / sp.bFaced) * 100).toFixed(2) : "0.00";
    let prob = (innings === 1) ? (50 + (score / 4) - (wickets * 6)) : (100 - (((target - score) / (maxBalls + 1 - balls)) * 12) + ((10 - wickets) * 6));
    prob = Math.max(1, Math.min(99, Math.round(prob)));
    document.getElementById("commentaryBox").innerText = msg;
    document.getElementById("strikerName").innerText = sn;
    document.getElementById("strikerStats").innerText = sp ? `${sp.runs} (${sp.bFaced}) | SR: ${sr}` : "---";
    document.getElementById("winProbText").innerText = (batting === userTeam ? prob : 100-prob) + "%";
    document.getElementById("probFill").style.width = (batting === userTeam ? prob : 100-prob) + "%";
    document.getElementById("liveLogoContainer").innerHTML = `<div class="team-icon ${teamData[batting].class}">${teamData[batting].short}</div>`;
    document.getElementById("scoreInfo").innerHTML = `${score}/${wickets} ${innings === 2 ? `<small>(T:${target})</small>` : ""}`;
    document.getElementById("ballInfo").innerHTML = `Balls: ${balls}/${maxBalls}`;
}

function finishMatch() {
    document.getElementById("buttons").innerHTML = "";
    let w = "";
    if (score >= target) w = batting;
    else if (score < target - 1) w = bowling;
    else {
        alert("IT'S A TIE! Super Over Time!");
        maxBalls = 6; innings = 1; target = Infinity;
        startInnings(); return;
    }
    points[w] += 2; 
    if (isFinal) {
        document.getElementById("gameArea").style.display = "none";
        document.getElementById("victoryScreen").style.display = "block";
        document.getElementById("championName").innerText = w.toUpperCase();
    } else {
        document.getElementById("nextBtn").style.display = "inline-block";
        document.getElementById("result").innerHTML = `<h2>🏆 ${w} wins!</h2>`;
    }
    updateStandings(); save();
}

function updateStandings() {
    let st = Object.entries(points).sort((a,b) => b[1] - a[1]);
    let h = "<table>"; st.forEach(t => h += `<tr><td>${t[0]}</td><td><b>${t[1]}</b></td></tr>`);
    document.getElementById("pointsTable").innerHTML = h + "</table>";
    let o = [...allPlayers].sort((a,b) => b.runs - a.runs)[0];
    let p = [...allPlayers].sort((a,b) => b.wickets - a.wickets)[0];
    document.getElementById("orangeCap").innerHTML = `<b>${o.name}</b><br>${o.runs} Runs`;
    document.getElementById("purpleCap").innerHTML = `<b>${p.name}</b><br>${p.wickets} Wkts`;
}

function simulateBot(t1, t2) { 
    points[Math.random() > 0.5 ? t1 : t2] += 2; 
    allPlayers.find(p => p.team === t1).runs += Math.floor(Math.random()*40);
    allPlayers.find(p => p.team === t2).runs += Math.floor(Math.random()*40);
}

function showFinals() {
    let s = Object.entries(points).sort((a,b) => b[1] - a[1]);
    document.getElementById("gameArea").style.display = "none"; document.getElementById("leagueEnd").style.display = "block";
    document.getElementById("finalistAnnouncement").innerHTML = `${s[0][0]} vs ${s[1][0]}`;
}

function playFinal() { isFinal = true; let s = Object.entries(points).sort((a,b) => b[1] - a[1]);
    userTeam = s[0][0]; opponent = s[1][0];
    document.getElementById("leagueEnd").style.display = "none"; document.getElementById("tossArea").style.display = "block"; }

function nextMatch() { document.getElementById("gameArea").style.display = "none"; startNextMatch(); }
function resetData() { localStorage.removeItem("MHL_vFinal_PRO_SHARE"); location.reload(); }
</script>
</body>
</html>
