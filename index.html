<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hundred Pro | Ultimate Manager</title>
    <style>
        :root { --primary: #00f2fe; --accent: #f1c40f; --danger: #ff4b2b; --glass: rgba(15, 20, 30, 0.95); }
        body { margin:0; font-family: 'Inter', sans-serif; color:white; text-align:center; background: #05070a; overflow-x:hidden; }
        .overlay { 
            min-height:100vh; padding:20px; 
            background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)), 
                        url('https://images.unsplash.com/photo-1531415074968-036ba1b575da?auto=format&fit=crop&q=80&w=2000');
            background-size: cover; background-position: center; background-attachment: fixed;
            display: flex; flex-direction: column; align-items: center;
        }
        .glass-card { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 30px; width: 90%; max-width: 500px; margin-top: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .score-big { font-size: 64px; font-weight: 900; margin: 5px 0; color: #fff; text-shadow: 0 0 20px var(--primary); }
        .btn-main { background: linear-gradient(135deg, #4facfe, #00f2fe); color: white; border: none; padding: 14px 35px; border-radius: 12px; font-weight: 800; cursor: pointer; text-transform: uppercase; margin-top: 15px; width: 100%; transition: 0.3s; }
        .btn-main:hover { transform: scale(1.02); box-shadow: 0 0 15px var(--primary); }
        .num-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
        .num-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 18px; border-radius: 16px; font-size: 22px; cursor: pointer; transition: 0.2s; }
        .num-btn:hover { background: var(--primary); color: #000; }
        .player-list { text-align: left; max-height: 250px; overflow-y: auto; margin: 15px 0; border: 1px solid #333; border-radius: 10px; }
        .player-item { padding: 12px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; cursor: pointer; }
        .player-item:hover { background: var(--primary); color: black; }
        .team-pill { padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 10px; }
        #gameArea, #tossArea, #teamSelect, #selectorView, #modeSelect { display:none; }
    </style>
</head>
<body>

<div class="overlay">
    <h2 style="letter-spacing: 5px; font-weight: 900; margin-top: 20px; color:var(--primary)">THE HUNDRED PRO</h2>

    <div id="loginArea" class="glass-card">
        <h3>MANAGER LOGIN</h3>
        <input type="text" id="mgrName" placeholder="Manager Name" style="padding:15px; width:85%; border-radius:12px; border:none; background:rgba(255,255,255,0.05); color:white; outline:none; margin-bottom:10px;">
        <button class="btn-main" onclick="handleLogin()">Join Stadium</button>
    </div>

    <div id="modeSelect" class="glass-card">
        <h3>SELECT MODE</h3>
        <button class="btn-main" onclick="setMode('CPU')">Player vs Computer</button>
        <button class="btn-main" style="background: #6c5ce7" onclick="setMode('PVP')">Local Multiplayer (P2P)</button>
    </div>

    <div id="teamSelect" class="glass-card">
        <h3>CHOOSE FRANCHISE</h3>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <div class="team-pill" style="background:#004ba0" onclick="pickTeam('MI London')">MI London</div>
            <div class="team-pill" style="background:#c5a059; color:black" onclick="pickTeam('Manchester SG')">Man. SG</div>
            <div class="team-pill" style="background:#ff822a" onclick="pickTeam('Sunrisers Leeds')">Sunrisers</div>
            <div class="team-pill" style="background:#ef4123" onclick="pickTeam('Southern Brave')">S. Brave</div>
            <div class="team-pill" style="background:#edac15; color:black" onclick="pickTeam('Birm. Phoenix')">Phoenix</div>
            <div class="team-pill" style="background:#fde100; color:black" onclick="pickTeam('Trent Rockets')">T. Rockets</div>
        </div>
    </div>

    <div id="selectorView" class="glass-card">
        <h3 id="selectorTitle">Strategy Room</h3>
        <div class="player-list" id="selectorList"></div>
    </div>

    <div id="gameArea" style="width:100%">
        <div class="glass-card" style="margin: 0 auto;">
            <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--primary); font-weight:bold;">
                <span>SET: <span id="oversLeft">0.0</span></span>
                <span style="color:var(--accent)">TARGET: <span id="targetDisplay">-</span></span>
                <span>BALLS: <span id="ballsLeft">100</span></span>
            </div>
            <div class="score-big" id="liveScore">0/0</div>
            <div id="turnInfo" style="color:var(--accent); font-size:14px; margin-bottom:5px;"></div>
            <div style="display:flex; justify-content:space-around; background:rgba(255,255,255,0.03); padding:15px; border-radius:15px;">
                <div style="text-align:left"><small>BAT</small><br><b id="curBatName">-</b><br><small id="batStats" style="color:var(--primary)">0(0)</small></div>
                <div style="text-align:right"><small>BOWL</small><br><b id="curBowlName">-</b><br><small id="bowlStats" style="color:var(--danger)">Wkts: 0</small></div>
            </div>
            <div id="commBox" style="font-weight:bold; color:var(--accent); margin:10px 0;">Play ball!</div>
            <div class="num-pad" id="numButtons"></div>
        </div>
    </div>

    <div id="tossArea" class="glass-card">
        <h2 id="matchHeader"></h2>
        <button class="btn-main" onclick="startMatch('bat')">Bat First</button>
        <button class="btn-main" style="background:#444" onclick="startMatch('bowl')">Bowl First</button>
    </div>
</div>

<script>
    const squads = {
        "MI London": [{n:"R. Sharma", r:"BAT"}, {n:"I. Kishan", r:"BAT"}, {n:"S. Yadav", r:"BAT"}, {n:"H. Pandya", r:"AR"}, {n:"J. Bumrah", r:"BOWL"}, {n:"G. Coetzee", r:"BOWL"}],
        "Manchester SG": [{n:"KL Rahul", r:"BAT"}, {n:"N. Pooran", r:"BAT"}, {n:"M. Stoinis", r:"AR"}, {n:"R. Bishnoi", r:"BOWL"}, {n:"M. Yadav", r:"BOWL"}, {n:"Y. Thakur", r:"BOWL"}],
        "Sunrisers Leeds": [{n:"T. Head", r:"BAT"}, {n:"A. Sharma", r:"BAT"}, {n:"H. Klaasen", r:"BAT"}, {n:"P. Cummins", r:"BOWL"}, {n:"B. Kumar", r:"BOWL"}, {n:"T. Natarajan", r:"BOWL"}],
        "Southern Brave": [{n:"D. Warner", r:"BAT"}, {n:"R. Pant", r:"BAT"}, {n:"M. Marsh", r:"AR"}, {n:"K. Yadav", r:"BOWL"}, {n:"A. Nortje", r:"BOWL"}, {n:"M. Kumar", r:"BOWL"}],
        "Birm. Phoenix": [{n:"L. Livingstone", r:"AR"}, {n:"B. Duckett", r:"BAT"}, {n:"M. Ali", r:"AR"}, {n:"C. Woakes", r:"BOWL"}, {n:"A. Milne", r:"BOWL"}, {n:"T. Helm", r:"BOWL"}],
        "Trent Rockets": [{n:"A. Hales", r:"BAT"}, {n:"J. Root", r:"BAT"}, {n:"R. Powell", r:"BAT"}, {n:"L. Gregory", r:"AR"}, {n:"R. Khan", r:"BOWL"}, {n:"L. Wood", r:"BOWL"}]
    };

    let gameMode = "CPU", myTeam = "", oppTeam = "", score = 0, wickets = 0, balls = 0, target = Infinity, innings = 1;
    let curBatObj = null, curBowlObj = null, p1Choice = null;

    function handleLogin() {
        if(!document.getElementById('mgrName').value) return alert("Enter Name!");
        document.getElementById('loginArea').style.display = 'none';
        document.getElementById('modeSelect').style.display = 'block';
    }

    function setMode(m) {
        gameMode = m;
        document.getElementById('modeSelect').style.display = 'none';
        document.getElementById('teamSelect').style.display = 'block';
    }

    function pickTeam(t) {
        myTeam = t;
        let ts = Object.keys(squads);
        oppTeam = ts.filter(x => x !== t)[Math.floor(Math.random()*(ts.length-1))];
        for(let team in squads) squads[team].forEach(p => { p.runs=0; p.bF=0; p.wkts=0; p.out=false; });
        document.getElementById('teamSelect').style.display = 'none';
        document.getElementById('tossArea').style.display = 'block';
        document.getElementById('matchHeader').innerText = `${myTeam} vs ${oppTeam}`;
    }

    function startMatch(c) {
        document.getElementById('tossArea').style.display = 'none';
        document.getElementById('gameArea').style.display = 'block';
        initInnings(1);
    }

    function initInnings(n) {
        innings = n; score = 0; wickets = 0; balls = 0;
        choosePlayer('BAT'); setOpponent('BOWL');
        setupButtons(); updateDisplay();
    }

    function choosePlayer(role) {
        let t = (role === 'BAT') ? (innings === 1 ? myTeam : oppTeam) : (innings === 1 ? oppTeam : myTeam);
        if (t === myTeam) {
            document.getElementById('selectorView').style.display = 'block';
            document.getElementById('gameArea').style.opacity = '0.1';
            let avail = squads[myTeam].filter(p => role === 'BAT' ? !p.out : (p.r !== 'BAT'));
            let h = ""; avail.forEach(p => h += `<div class="player-item" onclick="confirmSelect('${p.n}','${role}')">${p.n} <span style="font-size:10px">${p.r}</span></div>`);
            document.getElementById('selectorList').innerHTML = h;
        } else setOpponent(role);
    }

    function confirmSelect(n, r) {
        let p = squads[myTeam].find(x => x.n === n);
        if(r === 'BAT') curBatObj = p; else curBowlObj = p;
        document.getElementById('selectorView').style.display = 'none';
        document.getElementById('gameArea').style.opacity = '1';
        updateDisplay();
    }

    function setOpponent(role) {
        let t = (role === 'BAT') ? (innings === 1 ? myTeam : oppTeam) : (innings === 1 ? oppTeam : myTeam);
        if(t !== oppTeam) return;
        let avail = squads[oppTeam].filter(p => role === 'BAT' ? !p.out : (p.r !== 'BAT'));
        let p = avail[Math.floor(Math.random()*avail.length)];
        if(role === 'BAT') curBatObj = p; else curBowlObj = p;
    }

    function handleTurn(val) {
        if(gameMode === "PVP" && p1Choice === null) {
            p1Choice = val; document.getElementById('turnInfo').innerText = "PLAYER 2 TURN";
            return;
        }
        let p1 = (gameMode === "CPU") ? val : p1Choice;
        let p2 = (gameMode === "CPU") ? Math.floor(Math.random()*6)+1 : val;
        p1Choice = null; document.getElementById('turnInfo').innerText = (gameMode==="PVP") ? "PLAYER 1 TURN" : "";

        if(p1 === p2) {
            wickets++; curBatObj.out = true; curBowlObj.wkts++;
            document.getElementById('commBox').innerText = "WICKET! OUT!";
            if(wickets < 6) choosePlayer('BAT');
        } else {
            score += p1; curBatObj.runs += p1; curBatObj.bF++;
            document.getElementById('commBox').innerText = `Scored ${p1} runs!`;
        }
        balls++;
        if(balls % 5 === 0 && balls < 100) choosePlayer('BOWL');
        if(innings === 2 && score >= target) finish("BATTERS WIN!");
        else if(balls >= 100 || wickets >= 6) {
            if(innings === 1) { target = score + 1; alert("TARGET: " + target); initInnings(2); }
            else finish(score >= target ? "BATTERS WIN!" : "BOWLERS WIN!");
        }
        updateDisplay();
    }

    function setupButtons() {
        let h = ""; for(let i=1; i<=6; i++) h += `<button class="num-btn" onclick="handleTurn(${i})">${i}</button>`;
        document.getElementById('numButtons').innerHTML = h;
    }

    function updateDisplay() {
        document.getElementById('liveScore').innerText = `${score}/${wickets}`;
        document.getElementById('ballsLeft').innerText = 100 - balls;
        document.getElementById('oversLeft').innerText = `${Math.floor(balls/5)}.${balls%5}`;
        document.getElementById('targetDisplay').innerText = target === Infinity ? "-" : target;
        if(curBatObj) { document.getElementById('curBatName').innerText = curBatObj.n; document.getElementById('batStats').innerText = `${curBatObj.runs}(${curBatObj.bF})`; }
        if(curBowlObj) { document.getElementById('curBowlName').innerText = curBowlObj.n; document.getElementById('bowlStats').innerText = `Wkts: ${curBowlObj.wkts}`; }
    }

    function finish(m) { alert(m); location.reload(); }
</script>
</body>
</html>
