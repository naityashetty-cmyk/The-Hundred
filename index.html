<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hundred Pro | Ultimate Manager</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏏</text></svg>">
    <style>
        :root { --primary: #00f2fe; --accent: #f1c40f; --danger: #ff4b2b; --glass: rgba(255, 255, 255, 0.1); }
        body { margin:0; font-family: 'Inter', sans-serif; color:white; text-align:center; background: #05070a; overflow-x:hidden; }
        .overlay { 
            min-height:100vh; padding:20px; 
            background: radial-gradient(circle at center, rgba(0,0,0,0.5), rgba(0,0,0,0.9)), 
                        url('https://images.unsplash.com/photo-1531415074968-036ba1b575da?auto=format&fit=crop&q=80&w=2000');
            background-size: cover; background-position: center; background-attachment: fixed;
            display: flex; flex-direction: column; align-items: center;
        }
        .glass-card { background: rgba(15, 20, 30, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 28px; padding: 25px; width: 90%; max-width: 500px; margin-top: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        .score-big { font-size: 60px; font-weight: 900; margin: 5px 0; color: #fff; text-shadow: 0 0 15px var(--primary); }
        .hud-container { background: rgba(255,255,255,0.03); padding:12px; border-radius:15px; margin:10px 0; border: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-around; align-items: center; }
        .btn-main { background: linear-gradient(135deg, #4facfe, #00f2fe); color: white; border: none; padding: 12px 30px; border-radius: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .num-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .num-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 15px; border-radius: 12px; font-size: 20px; cursor: pointer; }
        .num-btn:hover { background: var(--primary); color: #000; }
        .player-list { text-align: left; max-height: 250px; overflow-y: auto; margin: 15px 0; border: 1px solid #333; border-radius: 10px; }
        .player-item { padding: 12px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; cursor: pointer; }
        .player-item:hover { background: var(--primary); color: black; }
        #gameArea, #tossArea, #teamSelect, #squadView, #selectorView { display:none; }
        .tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; background: #444; }
    </style>
</head>
<body>

<div class="overlay" id="mainBg">
    <h2 style="letter-spacing: 4px;">THE HUNDRED <span style="color: var(--primary);">ULTIMATE</span></h2>

    <div id="loginArea" class="glass-card" style="display:block;">
        <h3>MANAGER LOGIN</h3>
        <input type="text" id="mgrName" placeholder="Enter Name" style="padding:12px; width:80%; border-radius:10px; border:none; margin-bottom:15px; background:var(--glass); color:white;">
        <br><button class="btn-main" onclick="handleLogin()">Login</button>
    </div>

    <div id="teamSelect" class="glass-card">
        <h3>CHOOSE YOUR TEAM</h3>
        <div id="teamGrid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;"></div>
    </div>

    <div id="selectorView" class="glass-card">
        <h3 id="selectorTitle">Strategy Room</h3>
        <p id="selectorDesc">Select your next player</p>
        <div class="player-list" id="selectorList"></div>
    </div>

    <div id="gameArea" style="width:100%">
        <div class="glass-card" style="margin: 0 auto;">
            <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--primary); font-weight:bold;">
                <span>SET: <span id="oversLeft">0.0</span></span>
                <span style="color:var(--accent)">TARGET: <span id="targetDisplay">-</span></span>
                <span>BALLS: <span id="ballsLeft">100</span></span>
            </div>
            <div class="score-big" id="liveScore">0/0</div>
            <div class="hud-container">
                <div style="text-align:left"><small>BATSMAN</small><br><b id="curBatName">-</b><br><small id="batStats" style="color:var(--primary)">0(0)</small></div>
                <div style="font-weight:900; opacity:0.2;">VS</div>
                <div style="text-align:right"><small>BOWLING</small><br><b id="curBowlName">-</b><br><small id="bowlStats" style="color:var(--danger)">Wkts: 0</small></div>
            </div>
            <div id="commBox" style="font-weight:bold; color:var(--accent); min-height:20px;">Match starting...</div>
            <div class="num-pad" id="numButtons"></div>
        </div>
    </div>

    <div id="tossArea" class="glass-card">
        <h2 id="matchHeader"></h2>
        <button class="btn-main" onclick="startMatch('bat')">Bat First</button>
        <button class="btn-main" style="background:#444" onclick="startMatch('bowl')">Bowl First</button>
    </div>
</div>

<script>
    const squads = {
        "MI London": [
            {n:"R. Sharma", r:"BAT", runs:0, balls:0, wkts:0, out:false}, {n:"I. Kishan", r:"BAT", runs:0, balls:0, wkts:0, out:false}, 
            {n:"S. Yadav", r:"BAT", runs:0, balls:0, wkts:0, out:false}, {n:"H. Pandya", r:"AR", runs:0, balls:0, wkts:0, out:false},
            {n:"T. David", r:"BAT", runs:0, balls:0, wkts:0, out:false}, {n:"J. Bumrah", r:"BOWL", runs:0, balls:0, wkts:0, out:false}, 
            {n:"G. Coetzee", r:"BOWL", runs:0, balls:0, wkts:0, out:false}, {n:"P. Chawla", r:"BOWL", runs:0, balls:0, wkts:0, out:false}
        ],
        "Trent Rockets": [
            {n:"A. Hales", r:"BAT", runs:0, balls:0, wkts:0, out:false}, {n:"J. Root", r:"BAT", runs:0, balls:0, wkts:0, out:false}, 
            {n:"R. Powell", r:"BAT", runs:0, balls:0, wkts:0, out:false}, {n:"L. Gregory", r:"AR", runs:0, balls:0, wkts:0, out:false},
            {n:"R. Khan", r:"BOWL", runs:0, balls:0, wkts:0, out:false}, {n:"L. Wood", r:"BOWL", runs:0, balls:0, wkts:0, out:false}, 
            {n:"I. Sodhi", r:"BOWL", runs:0, balls:0, wkts:0, out:false}, {n:"S. Cook", r:"BOWL", runs:0, balls:0, wkts:0, out:false}
        ]
    };

    let myTeam = "", oppTeam = "Trent Rockets", score = 0, wickets = 0, balls = 0, target = Infinity, innings = 1;
    let curBatObj = null, curBowlObj = null, isSuperOver = false, maxBalls = 100, maxWkts = 8;

    function handleLogin() {
        document.getElementById('loginArea').style.display = 'none';
        document.getElementById('teamSelect').style.display = 'block';
        let h = ""; for(let t in squads) h += `<div class="player-item" onclick="pickTeam('${t}')">${t}</div>`;
        document.getElementById('teamGrid').innerHTML = h;
    }

    function pickTeam(t) {
        myTeam = t; oppTeam = (t === "MI London") ? "Trent Rockets" : "MI London";
        document.getElementById('teamSelect').style.display = 'none';
        document.getElementById('tossArea').style.display = 'block';
        document.getElementById('matchHeader').innerText = `${myTeam} vs ${oppTeam}`;
    }

    function startMatch(c) {
        document.getElementById('tossArea').style.display = 'none';
        document.getElementById('gameArea').style.display = 'flex';
        initInnings(1);
    }

    function initInnings(n) {
        innings = n; score = 0; wickets = 0; balls = 0;
        if(isSuperOver) { maxBalls = 6; maxWkts = 2; }
        // Reset player status
        for(let t in squads) squads[t].forEach(p => { p.runs=0; p.balls=0; p.wkts=0; p.out=false; });
        
        choosePlayer('BAT');
        setOpponentPlayer('BOWL');
        setupButtons();
        updateDisplay();
    }

    function choosePlayer(role) {
        let team = (role === 'BAT') ? ((innings === 1) ? myTeam : oppTeam) : ((innings === 1) ? oppTeam : myTeam);
        
        if (team === myTeam) {
            document.getElementById('selectorView').style.display = 'block';
            document.getElementById('gameArea').style.opacity = '0.1';
            document.getElementById('selectorTitle').innerText = (role === 'BAT') ? "SELECT NEXT BATSMAN" : "SELECT NEXT BOWLER";
            
            let avail = squads[myTeam].filter(p => role === 'BAT' ? !p.out : (p.r === 'BOWL' || p.r === 'AR'));
            let h = ""; avail.forEach(p => h += `<div class="player-item" onclick="confirmSelection('${p.n}', '${role}')">${p.n} <span class="tag">${p.r}</span></div>`);
            document.getElementById('selectorList').innerHTML = h;
        } else {
            setOpponentPlayer(role);
        }
    }

    function confirmSelection(name, role) {
        if(role === 'BAT') curBatObj = squads[myTeam].find(p => p.n === name);
        else curBowlObj = squads[myTeam].find(p => p.n === name);
        
        document.getElementById('selectorView').style.display = 'none';
        document.getElementById('gameArea').style.opacity = '1';
        updateDisplay();
    }

    function setOpponentPlayer(role) {
        let team = (role === 'BAT') ? ((innings === 1) ? myTeam : oppTeam) : ((innings === 1) ? oppTeam : myTeam);
        if (team !== oppTeam) return;

        let avail = squads[oppTeam].filter(p => role === 'BAT' ? !p.out : (p.r === 'BOWL' || p.r === 'AR'));
        let p = avail[Math.floor(Math.random()*avail.length)];
        if(role === 'BAT') curBatObj = p; else curBowlObj = p;
    }

    function handleTurn(val) {
        if(!curBatObj || !curBowlObj) return;
        let p1 = val, p2 = Math.floor(Math.random()*6)+1;
        document.getElementById('mainBg').style.animation = "";

        if(p1 === p2) {
            wickets++; curBatObj.out = true; curBowlObj.wkts++;
            document.getElementById('commBox').innerText = `OUT! ${curBatObj.n} is gone!`;
            if(wickets < maxWkts) choosePlayer('BAT');
        } else {
            let r = (innings === 1 && myTeam === myTeam) ? p1 : p2; // Simplified logic
            score += p1; curBatObj.runs += p1; curBatObj.balls++;
            document.getElementById('commBox').innerText = `Scored ${p1} runs!`;
        }

        balls++;
        if(balls % 5 === 0 && balls < maxBalls) choosePlayer('BOWL');
        
        if(innings === 2 && score >= target) finish("YOU WON!");
        else if(balls >= maxBalls || wickets >= maxWkts) {
            if(innings === 1) { target = score + 1; alert("TARGET: " + target); initInnings(2); }
            else finish(score === target-1 ? "TIE!" : "MATCH OVER!");
        }
        updateDisplay();
    }

    function setupButtons() {
        let h = ""; for(let i=1; i<=6; i++) h += `<button class="num-btn" onclick="handleTurn(${i})">${i}</button>`;
        document.getElementById('numButtons').innerHTML = h;
    }

    function updateDisplay() {
        document.getElementById('liveScore').innerText = `${score}/${wickets}`;
        document.getElementById('ballsLeft').innerText = maxBalls - balls;
        document.getElementById('oversLeft').innerText = `${Math.floor(balls/5)}.${balls%5}`;
        document.getElementById('targetDisplay').innerText = target === Infinity ? "-" : target;
        if(curBatObj) {
            document.getElementById('curBatName').innerText = curBatObj.n;
            document.getElementById('batStats').innerText = `${curBatObj.runs}(${curBatObj.balls})`;
        }
        if(curBowlObj) {
            document.getElementById('curBowlName').innerText = curBowlObj.n;
            document.getElementById('bowlStats').innerText = `Wkts: ${curBowlObj.wkts}`;
        }
    }

    function finish(m) { alert(m); location.reload(); }
    handleLogin();
</script>
</body>
</html>
